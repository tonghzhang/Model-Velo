name: model-velo

services:
  gateway:
    build:
      context: .
    image: model-velo:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODEL_VELO_HTTP_ADDR: :8080
      MODEL_VELO_POSTGRES_DSN: postgres://${MODEL_VELO_POSTGRES_USER:-model_velo}:${MODEL_VELO_POSTGRES_PASSWORD}@postgres:5432/${MODEL_VELO_POSTGRES_DB:-model_velo}?sslmode=disable
      MODEL_VELO_REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:${MODEL_VELO_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/model-velo-healthcheck
        - http://127.0.0.1:8080/readyz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - infrastructure

  usage-worker:
    image: model-velo:local
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/model-velo-usage-worker
    env_file:
      - .env
    environment:
      MODEL_VELO_WORKER_METRICS_ADDR: :9091
      MODEL_VELO_SERVICE_NAME: model-velo-usage-worker
      MODEL_VELO_POSTGRES_DSN: postgres://${MODEL_VELO_POSTGRES_USER:-model_velo}:${MODEL_VELO_POSTGRES_PASSWORD}@postgres:5432/${MODEL_VELO_POSTGRES_DB:-model_velo}?sslmode=disable
      MODEL_VELO_REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:${MODEL_VELO_WORKER_METRICS_PORT:-9091}:9091"
    depends_on:
      gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/model-velo-healthcheck
        - http://127.0.0.1:9091/readyz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - infrastructure

  admin:
    image: model-velo:local
    profiles: ["tools"]
    entrypoint:
      - /usr/local/bin/model-velo-admin
    env_file:
      - .env
    environment:
      MODEL_VELO_POSTGRES_DSN: postgres://${MODEL_VELO_POSTGRES_USER:-model_velo}:${MODEL_VELO_POSTGRES_PASSWORD}@postgres:5432/${MODEL_VELO_POSTGRES_DB:-model_velo}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - infrastructure

  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MODEL_VELO_POSTGRES_DB:-model_velo}
      POSTGRES_USER: ${MODEL_VELO_POSTGRES_USER:-model_velo}
      POSTGRES_PASSWORD: ${MODEL_VELO_POSTGRES_PASSWORD:?set MODEL_VELO_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MODEL_VELO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - infrastructure

  redis:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    environment:
      MODEL_VELO_REDIS_PASSWORD: ${MODEL_VELO_REDIS_PASSWORD:?set MODEL_VELO_REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - |
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --requirepass "$$MODEL_VELO_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${MODEL_VELO_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${MODEL_VELO_REDIS_PASSWORD}" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - infrastructure

volumes:
  postgres_data:
  redis_data:

networks:
  infrastructure:
    driver: bridge
